[project]
name = "cafe-scout"
version = "0.1.0"
description = "Interactive CLI search tool for hiring.cafe"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "curl-cffi>=0.7",
  "pydoll-python>=2.22.1",
  "playwright-stealth>=2.0.3",
]

[project.optional-dependencies]
session-export = ["playwright>=1.47"]

[project.scripts]
cafe-scout = "job_parser.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["job_parser*"]

[tool.uv]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
