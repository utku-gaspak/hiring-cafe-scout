[project]
name = "cafe-scout"
version = "0.1.0"
description = "Interactive CLI search tool for hiring.cafe"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "playwright>=1.50",
  "questionary>=2.0",
]

[project.scripts]
cafe-scout = "job_parser.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["job_parser*"]
